name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pasta android
        run: flutter create --platforms=android --org com.painelrpg .

      - name: Nome do app
        run: sed -i 's/android:label="painel_rpg"/android:label="Painel RPG"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: painel-rpg-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar em Releases (link público para baixar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Painel RPG v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
